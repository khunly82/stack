networks:
  monitoring:

volumes:
  pgdata:
  grafana-data:
  smtp4dev-data:

services:
  db:
    container_name: monitoring_postgres
    image: postgres:latest
    networks: [monitoring]
    environment:
      POSTGRES_USER: Khun
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: my_db
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    volumes: 
      - pgdata:/var/lib/postgresql


  db_exporter:
    container_name: postgres-exporter
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://Khun:1234@db:5432/my_db?sslmode=disable
    depends_on: [db]
    networks: [monitoring]
    ports:
      - 9187:9187

  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [monitoring]
    ports:
      - 8080:8080

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    networks: [monitoring]

  loki:
    container_name: Loki
    image: grafana/loki:latest
    ports:
      - 3100:3100
    networks: [monitoring]

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yml"]
    user: "0"
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
    networks: [monitoring]

  alloy:
    image: grafana/alloy:v1.7.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 12345:12345
    networks: [monitoring]

  api:
    build: ./app
    environment:
      DATABASE_URL: postgresql+psycopg2://Khun:1234@db:5432/my_db
      OTEL_SERVICE_NAME: api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports:
      - 8000:8000
    networks: [monitoring]
    depends_on: [db]

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    ports:
      - 3000:3000
    networks: [monitoring]
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

  smtp:
    container_name: stmp4dev2
    image: rnwood/smtp4dev:latest
    ports:
      - 25:25
      - 5000:80
    volumes:
      - smtp4dev-data:/smtp4dev
